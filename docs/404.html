    <!-- AUTO UPDATE & CACHE PURGE GUARD -->
    <script>
      (function() {
        var APP_BUILD = "1792750146996";
        var CACHE_KEY = "maisya_build_version";

        // Bersihkan parameter _ts dari address bar jika sebelumnya di-reload dengan cache buster
        if (window.location.search.indexOf('_ts=') !== -1) {
          var cleanSearch = window.location.search
            .replace(/([?&])_ts=[^&]+(&|$)/, '$1')
            .replace(/[?&]$/, '');
          var cleanUrl = window.location.pathname + (cleanSearch ? cleanSearch : '') + window.location.hash;
          window.history.replaceState({}, '', cleanUrl);
        }

        function purgeAndReload(newTime) {
          localStorage.setItem(CACHE_KEY, String(newTime));
          var clearCaches = ('caches' in window)
            ? caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              })
            : Promise.resolve();

          var clearSW = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              })
            : Promise.resolve();

          Promise.all([clearCaches, clearSW]).then(function() {
            var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
            // Hindari duplikasi parameter
            var targetUrl = window.location.pathname + '?_ts=' + newTime + window.location.hash;
            window.location.replace(targetUrl);
          });
        }

        // Cek versi terbaru langsung ke server dengan bypass HTTP cache
        fetch('./version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache'
          }
        })
        .then(function(res) { return res.ok ? res.json() : null; })
        .then(function(remote) {
          if (!remote || !remote.buildTime) return;
          var stored = localStorage.getItem(CACHE_KEY);

          // Jika HTML ini membawa versi lama ATAU cache localStorage berbeda dari server
          var isOutdated = (APP_BUILD !== "1792750146996" && String(remote.buildTime) !== String(APP_BUILD)) ||
                           (stored && String(stored) !== String(remote.buildTime));

          if (isOutdated) {
            console.log('[AutoUpdate] Versi baru ditemukan (' + remote.buildTime + '). Membersihkan semua cache...');
            purgeAndReload(remote.buildTime);
          } else {
            localStorage.setItem(CACHE_KEY, String(remote.buildTime));
          }
        })
        .catch(function() {});

        // Otomatis cek update worker
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].update();
            }
          });
        }
      })();
    </script>
